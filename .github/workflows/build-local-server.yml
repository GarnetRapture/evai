name: Build Local Server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-local-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload web bundle
        uses: actions/upload-artifact@v7
        with:
          name: evai-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  windows:
    name: Build evai-server.exe
    needs: web
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build server
        shell: msys2 {0}
        run: sh server/build.sh

      - name: Download web bundle
        uses: actions/download-artifact@v8
        with:
          name: evai-dist
          path: package

      - name: Package server with web bundle
        id: package
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          archive="evai-local-server-windows-x86_64-v${version}-${GITHUB_SHA::7}.zip"
          cp server/build/evai-server.exe package/evai-server.exe
          (cd package && 7z a -tzip "../${archive}" . > /dev/null)
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.archive }}
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  unix:
    name: Build evai-server (${{ matrix.target }})
    needs: web
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            cxx: g++-14
          - target: macos-arm64
            runner: macos-15
            cxx: g++-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build server
        env:
          CXX: ${{ matrix.cxx }}
        run: sh server/build.sh

      - name: Download web bundle
        uses: actions/download-artifact@v8
        with:
          name: evai-dist
          path: package

      - name: Package server with web bundle
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          archive="evai-local-server-${{ matrix.target }}-v${version}-${GITHUB_SHA::7}.tar.gz"
          cp server/build/evai-server package/evai-server
          chmod +x package/evai-server
          tar -czf "${archive}" -C package .
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.archive }}
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 90
          overwrite: true
