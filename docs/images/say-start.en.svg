  <path class="bubble" d="M26 10 h640 a14 14 0 0 1 14 14 v98 a14 14 0 0 1 -14 14 h-640 a14 14 0 0 1 -14 -14 v-35 l-14 -16 l14 -12 v-35 a14 14 0 0 1 14 -14 z"/>
  <text class="name" x="40" y="34">Mephistopheles</text>
  <text class="line" x="40" y="62">There are two ways to run it. Open the address and Chrome on-device AI answers;</text>
  <text class="line" x="40" y="88">run evai-server and the Ollama on your PC takes over the conversation.</text>
  <text class="strong" x="40" y="114">Either way the record never leaves this machine. Please rest assured.</text>
